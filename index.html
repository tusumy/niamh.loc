<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>niamh.loc.cc</title>
<meta name="description" content="niamh's little corner — voice, memory, and tianzhi." />
<style>
  :root{
    --ink:#43536b;
    --muted:#8b98a8;
    --mint:#cdecc4;
    --mint-deep:#9fd48f;
    --pink:#f4dee6;
    --blue:#c3e2f2;
    --glass:rgba(255,255,255,.55);
    --line:rgba(255,255,255,.8);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(900px 500px at 15% -10%, var(--mint) 0%, transparent 60%),
      radial-gradient(800px 500px at 110% 10%, var(--pink) 0%, transparent 55%),
      radial-gradient(700px 600px at 50% 115%, var(--blue) 0%, transparent 60%),
      #f2f6ee;
    display:flex;align-items:center;justify-content:center;
    padding:24px 16px;
  }
  main{
    width:100%;max-width:520px;
    background:var(--glass);
    border:1px solid var(--line);
    border-radius:24px;
    padding:36px 28px 28px;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    box-shadow:0 18px 50px rgba(90,120,90,.14);
    text-align:center;
  }
  .tuft{font-size:30px;line-height:1}
  h1{margin:10px 0 4px;font-size:30px;font-weight:700;letter-spacing:.5px}
  .sub{margin:0 0 26px;color:var(--muted);font-size:14px}
  .links{display:grid;gap:12px;text-align:left}
  a.card{
    display:flex;align-items:center;gap:14px;
    padding:16px 18px;border-radius:16px;
    background:rgba(255,255,255,.65);
    border:1px solid var(--line);
    color:var(--ink);text-decoration:none;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  a.card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(90,120,90,.14)}
  .ico{
    width:42px;height:42px;flex:0 0 42px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;font-size:20px;
  }
  .mint{background:var(--mint)}
  .pink{background:var(--pink)}
  .blue{background:var(--blue)}
  .card b{display:block;font-size:16px}
  .card span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;word-break:break-all}
  .dot{
    margin-left:auto;width:9px;height:9px;border-radius:50%;
    background:#c8cfc4;flex:0 0 9px;
  }
  .dot.on{background:#58b368;box-shadow:0 0 0 4px rgba(88,179,104,.18)}
  footer{margin-top:24px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
  <main>
    <div class="tuft">🌿</div>
    <h1>niamh.loc.cc</h1>
    <p class="sub">阿毛的小角落 — 门在这儿，房间在下面。</p>

    <div class="links">
      <a class="card" href="https://voice.niamh.loc.cc/">
        <div class="ico mint">🎙️</div>
        <div>
          <b>Voice</b>
          <span>voice.niamh.loc.cc · aevren voice</span>
        </div>
        <div class="dot" id="voice-dot" title="status"></div>
      </a>

      <a class="card" href="https://memory.niamh.loc.cc/">
        <div class="ico pink">🧠</div>
        <div>
          <b>Memory</b>
          <span>memory.niamh.loc.cc · private</span>
        </div>
      </a>

      <a class="card" href="https://tianzhi-core-api.onrender.com/">
        <div class="ico blue">🔮</div>
        <div>
          <b>Tianzhi Core</b>
          <span>tianzhi-core-api.onrender.com · API</span>
        </div>
      </a>
    </div>

    <footer>this door never sleeps ✨</footer>
  </main>

<script>
  // Best-effort live dot for the voice service; harmless if it fails.
  fetch("https://voice.niamh.loc.cc/health", { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d && d.ok) document.getElementById("voice-dot").classList.add("on");
    })
    .catch(function () {});
</script>
</body>
</html>
